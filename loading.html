<!DOCTYPE html>
<html lang="zh-CN" data-theme="garden">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>加载中 · 个人履历</title>
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/loading.css">
</head>
<body>

<!-- 中央舞台 -->
<div class="stage" id="stage">
  <!-- 小人头（分层：头 + 装备层） -->
  <div class="figure" id="figure"></div>
  <!-- 手（真实风格，非彩色，从屏幕外伸入） -->
  <div class="hand hand-left" id="hand-left"></div>
  <div class="hand hand-right" id="hand-right"></div>
  <!-- 装备预告区 -->
  <div class="next-hint" id="next-hint">
    <div class="next-hint-label" id="next-label"></div>
    <div class="next-hint-slot" id="next-slot"></div>
  </div>
</div>

<!-- 底部进度 -->
<div class="progress-wrap">
  <div class="progress-track">
    <div class="progress-fill" id="progress-fill"></div>
  </div>
  <div class="progress-num" id="progress-num">0%</div>
</div>

<!-- 进入示意（剪纸箭头，100% 后浮现，无文字） -->
<div class="enter" id="enter" aria-label="进入">
  <svg viewBox="0 0 80 40" width="80" height="40">
    <g class="enter-arrow" id="enter-arrow">
      <path d="M4 20 H58" stroke-width="4" stroke-linecap="round"/>
      <path d="M46 9 L60 20 L46 31" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    </g>
  </svg>
</div>

<script src="js/loading.js"></script>
</body>
</html>
