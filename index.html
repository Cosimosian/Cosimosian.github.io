<!DOCTYPE html>
<html lang="zh-CN" data-theme="garden">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>个人履历 — 环境美学 × 数字建构 × 系统工程</title>
<link rel="stylesheet" href="css/tokens.css?v=20260924">
<link rel="stylesheet" href="css/base.css?v=20260924">
<link rel="stylesheet" href="css/components.css?v=20260920">
<link rel="stylesheet" href="css/timeline.css?v=20260920">
<link rel="stylesheet" href="css/mobile.css?v=20260924">
<link rel="stylesheet" href="css/themes-effects.css?v=20260924">
<!-- webfonts（主题 v1.0 标题字体；jsDelivr CDN，加载失败自动回退系统字体栈） -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/noto-serif-sc/400.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/noto-serif-sc/600.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/lxgw-wenkai-webfont@1.7.0/style.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/press-start-2p/400.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/space-grotesk/500.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/space-grotesk/700.css">
</head>
<body>

<canvas id="china-map-bg"></canvas>

<div id="ui-overlay">

  <header class="header-section">
    <h1 class="stage-description" id="stage-desc">自然器物之间：环境美学与人的感知联结</h1>
  </header>

  <main class="content-section" id="content-section">
    <!-- LEFT DISPLAY -->
    <div class="display-panel" id="display-panel">
      <div id="display-content">选择右侧项目查看详情</div>
    </div>

    <!-- RIGHT CONSOLE + THEME -->
    <div class="console-panel" id="console-panel">
      <div class="panel-theme-dots" id="panel-theme-dots">
        <button class="panel-theme-dot garden active" data-theme="garden" title="风景园林 · 落地景观与产品设计"></button>
        <button class="panel-theme-dot code" data-theme="code" title="软件工程 · 初探技术与商业系统"></button>
        <button class="panel-theme-dot ai" data-theme="ai" title="显示软件开发 · 工程训练和AI探索"></button>
        <button class="panel-theme-dot future" data-theme="future" title="未来"></button>
      </div>
      <div class="section-label">项目导航</div>
      <div id="console-list"></div>
    </div>
  </main>

  <!-- CALIPER TIMELINE -->
  <footer class="timeline-section" id="timeline-section">
    <div class="caliper-scroll" id="caliper-scroll">
      <div class="caliper-ticks" id="caliper-ticks">
        <canvas id="ticks-canvas"></canvas>
      </div>
      <div class="caliper-track-wrap" id="caliper-track-wrap">
        <div class="caliper-track-line"></div>
        <!-- 阶段分界线与标签由 js/timeline.js 按 STAGE_ORDER 动态生成 -->
        <div class="caliper-slider" id="caliper-slider">
          <div class="current-year-display" id="year-display">2016.9</div>
        </div>
      </div>
    </div>
  </footer>

  <!-- BOTTOM-RIGHT CORNER -->
  <div class="stage-timeline" id="stage-timeline"></div>
  <div class="mouse-coords" id="mouse-coords">0.00°N, 0.00°E</div>
  <div class="map-tooltip" id="map-tooltip"></div>

</div>

<!-- MODAL -->
<div class="modal-overlay" id="modal-overlay">
  <div class="modal-content">
    <button class="modal-close">&times;</button>
    <div class="modal-head">
      <h2 class="modal-title" id="modal-title"></h2>
      <div class="display-tags" id="modal-tags"></div>
      <div class="display-location modal-meta-outcome" id="modal-outcome"></div>
    </div>
    <article class="modal-article" id="modal-article"></article>
  </div>
</div>

<!-- MOBILE UI（≤640px 显示；桌面端基线隐藏） -->
<div id="mobile-ui">
  <header class="m-header">
    <div class="m-badge" id="m-badge">阶段 01</div>
    <h1 class="m-desc" id="m-desc">自然器物之间：环境美学与人的感知联结</h1>
    <button class="m-more" id="m-more" aria-label="经历时间线"><span></span><span></span><span></span></button>
  </header>
  <main class="m-flow" id="m-flow"></main>
  <footer class="m-dots" id="m-dots"></footer>
</div>

<!-- 经历时间线抽屉（右侧滑入） -->
<div id="m-drawer-overlay">
  <aside class="m-drawer">
    <button class="m-drawer-close" id="m-drawer-close" aria-label="关闭">×</button>
    <div class="m-drawer-list" id="m-drawer-list"></div>
  </aside>
</div>

<script src="assets/data/china-geo-data.js?v=20260920"></script>
<script src="assets/data/map-style-data.js?v=20260920"></script>
<script src="data/resume.js?v=20260923"></script>
<script src="shared/projection.js?v=20260920"></script>
<script src="shared/utils.js?v=20260920"></script>
<script src="js/projectDoc.js?v=20260920"></script>
<script src="js/modal.js?v=20260922"></script>
<script src="js/map/chinaMap.js?v=20260920"></script>
<script src="js/timeline.js?v=20260920"></script>
<script src="js/theme.js?v=20260920"></script>
<script src="js/experiences.js?v=20260920"></script>
<script src="js/panels.js?v=20260920"></script>
<script src="js/main.js?v=20260920"></script>
<script src="js/mobile.js?v=20260922"></script>

</body>
</html>
