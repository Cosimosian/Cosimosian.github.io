<!DOCTYPE html>
<html lang="zh-CN" data-theme="garden">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>个人履历 — 环境美学 × 数字建构 × 系统工程</title>
<link rel="stylesheet" href="css/tokens.css?v=20260917">
<link rel="stylesheet" href="css/base.css?v=20260917">
<link rel="stylesheet" href="css/components.css?v=20260917">
<link rel="stylesheet" href="css/timeline.css?v=20260917">
<link rel="stylesheet" href="css/mobile-gate.css?v=20260917">
</head>
<body>

<canvas id="china-map-bg"></canvas>

<div id="ui-overlay">

  <header class="header-section">
    <h1 class="stage-description" id="stage-desc">自然器物之间：环境美学与人的感知联结</h1>
  </header>

  <main class="content-section" id="content-section">
    <!-- LEFT DISPLAY -->
    <div class="display-panel" id="display-panel">
      <div id="display-content">选择右侧项目查看详情</div>
    </div>

    <!-- RIGHT CONSOLE + THEME -->
    <div class="console-panel" id="console-panel">
      <div class="panel-theme-dots" id="panel-theme-dots">
        <button class="panel-theme-dot garden active" data-theme="garden" title="风景园林 · 落地景观与产品设计"></button>
        <button class="panel-theme-dot code" data-theme="code" title="软件工程 · 初探技术与商业系统"></button>
        <button class="panel-theme-dot ai" data-theme="ai" title="显示软件开发 · 工程训练和AI探索"></button>
        <button class="panel-theme-dot future" data-theme="future" title="未来"></button>
      </div>
      <div class="section-label">项目导航</div>
      <div id="console-list"></div>
    </div>
  </main>

  <!-- CALIPER TIMELINE -->
  <footer class="timeline-section" id="timeline-section">
    <div class="caliper-ticks" id="caliper-ticks">
      <canvas id="ticks-canvas"></canvas>
    </div>
    <div class="caliper-track-wrap" id="caliper-track-wrap">
      <div class="caliper-track-line"></div>
      <!-- 阶段分界线与标签由 js/timeline.js 按 STAGE_ORDER 动态生成 -->
      <div class="caliper-slider" id="caliper-slider">
        <div class="current-year-display" id="year-display">2016.9</div>
      </div>
    </div>
  </footer>

  <!-- BOTTOM-RIGHT CORNER -->
  <div class="stage-timeline" id="stage-timeline"></div>
  <div class="mouse-coords" id="mouse-coords">0.00°N, 0.00°E</div>
  <div class="map-tooltip" id="map-tooltip"></div>

</div>

<!-- MODAL -->
<div class="modal-overlay" id="modal-overlay">
  <div class="modal-content">
    <button class="modal-close">&times;</button>
    <div class="modal-head">
      <img class="modal-image" id="modal-img" src="" alt="">
      <h2 class="modal-title" id="modal-title"></h2>
      <p class="modal-desc" id="modal-desc"></p>
      <div class="display-tags" id="modal-tags"></div>
      <div class="display-location modal-meta" id="modal-location"></div>
      <div class="display-location modal-meta-outcome" id="modal-outcome"></div>
    </div>
    <article class="modal-article" id="modal-article"></article>
  </div>
</div>

<script src="assets/data/china-geo-data.js?v=20260807"></script>
<script src="assets/data/map-style-data.js?v=20260807"></script>
<script src="data/resume.js"></script>
<script src="shared/projection.js"></script>
<script src="shared/utils.js"></script>
<script src="js/projectDoc.js"></script>
<script src="js/map/chinaMap.js"></script>
<script src="js/timeline.js"></script>
<script src="js/theme.js"></script>
<script src="js/experiences.js"></script>
<script src="js/panels.js"></script>
<script src="js/main.js"></script>

<!-- MOBILE GATE -->
<div class="mobile-gate">
  <div class="gate-icon">🖥️</div>
  <div class="gate-title">请用桌面端查看，以获得最佳效果</div>
  <div class="gate-sub">本网站为大屏沉浸式体验设计<br>请使用宽度大于 768px 的桌面设备访问</div>
  <div class="gate-hint">▌PLEASE VIEW ON DESKTOP · ≥768PX</div>
</div>

</body>
</html>
