<!DOCTYPE html>
<html lang="zh-CN" data-theme="garden">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>个人履历 — 风景园林 × 软件工程 × AI工程</title>
<style>
/* ============================================================
   RESET & CSS VARIABLES (地基层)
   ============================================================ */
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}

:root{
  --blur-amount:10px;
  --touch-target:48px;
  --fs-title:clamp(2rem,8vw,4.5rem);
  --timeline-h:7vh;
  --panel-opacity:0.25;
  --panel-bg:rgba(255,255,255,0.25);
  --panel-border:1px solid rgba(255,255,255,0.25);
  --panel-text-shadow:0 1px 3px rgba(0,0,0,0.4);
  --color-bg:#F5F0E6;
  --color-text:#3C3228;
  --color-accent:#92A87C;
  --color-muted:rgba(60,50,40,0.7);
  --color-tag-bg:rgba(146,168,124,0.3);
  --color-tag-text:#3C3228;
  --color-border:rgba(255,255,255,0.3);
  --map-bg:#F5F0E6;
  --map-stroke:#92A87C;
  --map-marker-fill:#92A87C;
  --caliper-track:rgba(146,168,124,0.4);
  --caliper-tick:rgba(146,168,124,0.5);
  --caliper-label:rgba(60,50,40,0.8);
  --caliper-slider-bg:#92A87C;
  --caliper-slider-border:#5a7050;
  --stage-boundary:#92A87C;
  --transition-theme:0.6s cubic-bezier(0.22,1,0.36,1);
}

[data-theme="code"]{
  --panel-bg:rgba(22,33,62,0.25);
  --panel-border:1px solid rgba(0,255,204,0.2);
  --panel-text-shadow:0 0 6px rgba(0,255,204,0.3);
  --color-bg:#1a1a2e;
  --color-text:#EAEAEA;
  --color-accent:#00ffcc;
  --color-muted:rgba(200,200,210,0.7);
  --color-tag-bg:rgba(0,255,204,0.15);
  --color-tag-text:#00ffcc;
  --color-border:rgba(0,255,204,0.25);
  --map-bg:#1a1a2e;
  --map-stroke:#00ffcc;
  --map-marker-fill:#00ffcc;
  --caliper-track:rgba(0,255,204,0.3);
  --caliper-tick:rgba(0,255,204,0.4);
  --caliper-label:rgba(0,255,204,0.7);
  --caliper-slider-bg:#00ffcc;
  --caliper-slider-border:#00aa88;
  --stage-boundary:#00ffcc;
}

[data-theme="ai"]{
  --panel-bg:rgba(10,10,10,0.22);
  --panel-border:1px solid rgba(0,217,255,0.2);
  --panel-text-shadow:0 0 6px rgba(0,217,255,0.3);
  --color-bg:#0a0a0a;
  --color-text:#E0E0E0;
  --color-accent:#00d9ff;
  --color-muted:rgba(200,200,210,0.6);
  --color-tag-bg:rgba(0,217,255,0.12);
  --color-tag-text:#00d9ff;
  --color-border:rgba(0,217,255,0.25);
  --map-bg:#0a0a0a;
  --map-stroke:#00d9ff;
  --map-marker-fill:#00d9ff;
  --caliper-track:rgba(0,217,255,0.3);
  --caliper-tick:rgba(0,217,255,0.4);
  --caliper-label:rgba(0,217,255,0.7);
  --caliper-slider-bg:#00d9ff;
  --caliper-slider-border:#0099bb;
  --stage-boundary:#00d9ff;
}

/* ============================================================
   RESPONSIVE BREAKPOINTS
   ============================================================ */
@media(min-width:1201px){:root{--blur-amount:10px}}
@media(min-width:769px)and(max-width:1200px){:root{--blur-amount:5px}}
@media(max-width:768px){
  :root{
    --blur-amount:0px;--timeline-h:15vh;--panel-opacity:0.9;
    --panel-bg:rgba(255,255,255,0.9);--panel-border:1px solid #ddd;
    --panel-text-shadow:none;
  }
}

/* ============================================================
   LAYOUT
   ============================================================ */
body{
  font-family:'Inter','Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif;
  background:var(--color-bg);
  color:var(--color-text);
  overflow:hidden;height:100vh;
  transition:background var(--transition-theme),color var(--transition-theme);
}

/* --- FULLSCREEN MAP CANVAS BACKGROUND --- */
#china-map-bg{
  position:fixed;inset:0;z-index:0;
  width:100vw;height:100vh;
}

/* --- FLOATING UI OVERLAY --- */
#ui-overlay{
  position:fixed;inset:0;z-index:1;
  pointer-events:none;
}

/* --- HEADER (transparent overlay) --- */
.header-section{
  position:absolute;top:0;left:0;right:0;
  padding:24px 32px;
  pointer-events:auto;
  text-align:center;
  background:transparent;
}
.stage-badge{
  display:inline-block;
  background:var(--color-accent);
  color:#fff;padding:4px 18px;border-radius:20px;
  font-size:13px;letter-spacing:2px;margin-bottom:10px;
  transition:background var(--transition-theme);
}
.stage-description{
  font-size:clamp(15px,2.2vw,22px);font-weight:400;
  color:var(--color-text);max-width:700px;margin:0 auto;line-height:1.5;
  text-shadow:0 1px 4px rgba(0,0,0,0.3);
  transition:color var(--transition-theme);
}

/* --- PANELS --- */
.content-section{
  position:absolute;top:16vh;left:0;right:0;bottom:calc(var(--timeline-h) + 4px);
  pointer-events:none;
}

/* LEFT CONSOLE PANEL */
.console-panel{
  position:absolute;left:2vw;top:0;
  width:26%;max-height:100%;
  overflow-y:auto;
  pointer-events:auto;
  background:var(--panel-bg);
  border:var(--panel-border);
  border-radius:12px;
  backdrop-filter:blur(var(--blur-amount));
  -webkit-backdrop-filter:blur(var(--blur-amount));
  padding:16px;
  color:var(--color-text);
  text-shadow:var(--panel-text-shadow);
  transition:background var(--transition-theme),border-color var(--transition-theme);
}
.console-panel::-webkit-scrollbar{width:3px}
.console-panel::-webkit-scrollbar-thumb{background:var(--color-accent);border-radius:2px;opacity:0.5}
.console-panel h3{
  font-size:13px;font-weight:600;letter-spacing:1px;
  color:var(--color-accent);margin-bottom:14px;padding-bottom:8px;
  border-bottom:1px solid var(--color-border);
}
.console-item{
  padding:10px 12px;border-radius:8px;cursor:pointer;
  margin-bottom:6px;transition:background 0.2s;
  font-size:14px;line-height:1.4;
  color:var(--color-text);text-shadow:var(--panel-text-shadow);
}
.console-item:hover{background:var(--color-tag-bg)}
.console-item.active{
  background:var(--color-accent);color:#fff;text-shadow:none;font-weight:600;
}

/* RIGHT DISPLAY PANEL */
.display-panel{
  position:absolute;right:2vw;top:0;
  width:46%;max-height:100%;
  overflow-y:auto;
  pointer-events:auto;
  background:var(--panel-bg);
  border:var(--panel-border);
  border-radius:12px;
  backdrop-filter:blur(var(--blur-amount));
  -webkit-backdrop-filter:blur(var(--blur-amount));
  padding:20px;
  color:var(--color-text);
  text-shadow:var(--panel-text-shadow);
  transition:background var(--transition-theme),border-color var(--transition-theme);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
}
.display-panel::-webkit-scrollbar{width:3px}
.display-panel::-webkit-scrollbar-thumb{background:var(--color-accent);border-radius:2px;opacity:0.5}
.display-image{
  width:100%;max-height:200px;object-fit:cover;border-radius:8px;margin-bottom:16px;
  background:var(--color-tag-bg);
}
.display-title{font-size:22px;font-weight:700;margin-bottom:8px}
.display-desc{font-size:14px;color:var(--color-muted);line-height:1.7;margin-bottom:14px;text-align:center}
.display-tags{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-bottom:10px}
.display-tag{
  background:var(--color-tag-bg);color:var(--color-tag-text);
  padding:3px 12px;border-radius:12px;font-size:12px;
}
.display-location{font-size:12px;color:var(--color-muted)}
.display-empty{
  text-align:center;opacity:0.5;
  font-size:28px;color:var(--color-accent);margin-bottom:8px;
}

/* --- CALIPER TIMELINE --- */
.timeline-section{
  position:absolute;bottom:0;left:0;right:0;
  height:var(--timeline-h);
  pointer-events:auto;
  display:flex;flex-direction:column;align-items:center;justify-content:flex-end;
  padding-bottom:2px;
  transition:height var(--transition-theme);
}

/* Ticks layer */
.caliper-ticks{
  position:relative;width:88%;height:18px;
  margin-bottom:0;
}
.caliper-ticks canvas{
  width:100%;height:100%;
}

/* Track + slider */
.caliper-track-wrap{
  position:relative;width:88%;height:22px;
}
.caliper-track-line{
  position:absolute;top:50%;left:0;right:0;height:1px;
  background:var(--caliper-track);
  transform:translateY(-50%);
}
.caliper-slider{
  position:absolute;top:2px;bottom:2px;
  width:3px;
  background:var(--caliper-slider-bg);
  border:1px solid var(--caliper-slider-border);
  border-radius:1px;
  transform:translateX(-50%);
  cursor:grab;
  z-index:10;
  transition:box-shadow 0.15s;
}
.caliper-slider::before{
  content:'';position:absolute;top:-6px;left:50%;transform:translateX(-50%);
  width:0;height:0;
  border-left:4px solid transparent;
  border-right:4px solid transparent;
  border-bottom:6px solid var(--caliper-slider-bg);
}
.caliper-slider:hover{box-shadow:0 0 8px var(--caliper-slider-bg)}
.caliper-slider.dragging{cursor:grabbing;box-shadow:0 0 12px var(--caliper-slider-bg)}

/* Stage boundaries on track */
.stage-boundary-marker{
  position:absolute;top:0;bottom:0;width:1px;
  border-left:1px dashed var(--stage-boundary);
  opacity:0.6;pointer-events:none;z-index:2;
}

/* Year label below track */
.caliper-year-label{
  position:absolute;bottom:-16px;transform:translateX(-50%);
  font-size:10px;color:var(--caliper-label);white-space:nowrap;pointer-events:none;
}

/* Current year indicator */
.current-year-display{
  position:absolute;top:-20px;transform:translateX(-50%);
  font-size:11px;color:var(--color-accent);font-weight:600;
  white-space:nowrap;pointer-events:none;
  text-shadow:0 0 6px var(--color-accent);
}

/* --- THEME SWITCHER DOTS --- */
.theme-switcher{
  position:fixed;top:16px;right:16px;z-index:150;
  display:flex;gap:6px;pointer-events:auto;
}
.theme-dot{
  width:28px;height:28px;border-radius:50%;
  border:2px solid transparent;cursor:pointer;
  transition:transform 0.2s,border-color 0.2s;
  box-shadow:0 2px 6px rgba(0,0,0,0.2);
}
.theme-dot:hover{transform:scale(1.15)}
.theme-dot.active{border-color:#fff;transform:scale(1.1)}
.theme-dot.garden{background:#92A87C}
.theme-dot.code{background:#00ffcc}
.theme-dot.ai{background:#00d9ff}

/* --- MODAL (unchanged) --- */
.modal-overlay{
  position:fixed;inset:0;background:rgba(0,0,0,0.65);z-index:200;
  display:flex;align-items:center;justify-content:center;
  opacity:0;pointer-events:none;transition:opacity 0.3s;
}
.modal-overlay.active{opacity:1;pointer-events:auto}
.modal-content{
  background:var(--panel-bg);border-radius:16px;padding:28px;
  max-width:500px;width:90%;max-height:80vh;overflow-y:auto;
  box-shadow:0 20px 60px rgba(0,0,0,0.4);position:relative;
  transform:scale(0.9);transition:transform 0.3s cubic-bezier(0.22,1,0.36,1);
  border:var(--panel-border);color:var(--color-text);
  backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
}
.modal-overlay.active .modal-content{transform:scale(1)}
.modal-close{
  position:absolute;top:12px;right:12px;width:36px;height:36px;
  border:none;background:var(--color-tag-bg);color:var(--color-text);
  border-radius:50%;cursor:pointer;font-size:16px;
  display:flex;align-items:center;justify-content:center;
}
.modal-close:hover{background:var(--color-accent);color:#fff}
.modal-image{width:100%;height:200px;object-fit:cover;border-radius:8px;margin-bottom:14px;background:var(--color-tag-bg)}
.modal-title{font-size:22px;font-weight:700;margin-bottom:8px}
.modal-desc{font-size:14px;color:var(--color-muted);line-height:1.7;margin-bottom:14px}

/* ============================================================
   RESPONSIVE — MOBILE (no changes to mobile layout)
   ============================================================ */
@media(max-width:768px){
  body{overflow-y:auto;overflow-x:hidden}
  #china-map-bg{display:none}
  #ui-overlay{position:relative;pointer-events:auto}

  .header-section{
    position:fixed;top:0;left:0;right:0;z-index:100;
    background:var(--color-bg);padding:12px 16px;
    border-bottom:1px solid var(--color-border);
    text-shadow:none;
  }
  .stage-description{text-shadow:none;font-size:14px}

  .content-section{
    position:relative;top:auto;bottom:auto;
    margin-top:12vh;margin-bottom:var(--timeline-h);
    min-height:calc(100vh - 12vh - var(--timeline-h));
    pointer-events:auto;
  }
  .console-panel,.display-panel{
    display:none;
  }
  .project-flow-mobile{
    display:flex;flex-direction:column;gap:14px;padding:14px;
    max-width:420px;margin:0 auto;
  }
  .project-card-mobile{
    background:var(--panel-bg);border:var(--panel-border);border-radius:12px;
    overflow:hidden;cursor:pointer;text-shadow:none;
    transition:transform 0.2s;
  }
  .project-card-mobile:active{transform:scale(0.98)}
  .card-image-mobile{width:100%;height:170px;object-fit:cover;background:var(--color-tag-bg)}
  .card-content-mobile{padding:14px}
  .card-title-mobile{font-size:16px;font-weight:600;color:var(--color-text);margin-bottom:4px}
  .card-desc-mobile{font-size:13px;color:var(--color-muted);line-height:1.5;margin-bottom:8px}
  .card-tags-mobile{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:6px}
  .card-tag-mobile{background:var(--color-tag-bg);color:var(--color-tag-text);padding:3px 10px;border-radius:12px;font-size:11px}
  .card-location-mobile{font-size:11px;color:var(--color-muted)}

  .timeline-section{
    position:fixed;bottom:0;left:0;right:0;z-index:100;
    background:var(--color-bg);border-top:1px solid var(--color-border);
    height:var(--timeline-h);
  }
  .theme-switcher{top:auto;bottom:calc(var(--timeline-h) + 10px);right:10px}
  .current-year-display{font-size:9px;top:-14px}
}

@media(prefers-reduced-motion:reduce){
  .caliper-slider,.modal-content{transition:none!important}
}
</style>
</head>

// ============================================================
// STATE
// ============================================================
let currentStage='garden';
let currentYear=YEAR_START;
let selectedProjectId=null;
let isDragging=false;

// ============================================================
// MAP CANVAS (fullscreen background)
// ============================================================
const mapCanvas=document.getElementById('china-map-bg');
const mapCtx=mapCanvas.getContext('2d');

function resizeMap(){
  mapCanvas.width=window.innerWidth;
  mapCanvas.height=window.innerHeight;
  drawMap();
}
function drawMap(){
  const w=mapCanvas.width,h=mapCanvas.height;
  mapCtx.clearRect(0,0,w,h);

  // Background
  mapCtx.fillStyle=getComputedStyle(document.documentElement).getPropertyValue('--map-bg').trim();
  mapCtx.fillRect(0,0,w,h);

  // Center point
  const cx=w/2,cy=h/2;
  const scale=Math.min(w,h)*0.42;

  // Simplified China outline (centered)
  mapCtx.strokeStyle=getComputedStyle(document.documentElement).getPropertyValue('--map-stroke').trim();
  mapCtx.lineWidth=1.5;
  mapCtx.globalAlpha=0.5;
  mapCtx.beginPath();
  // Main body
  const body=[
    [0.15,0.05],[0.25,-0.02],[0.38,-0.05],[0.50,-0.03],[0.62,0.0],
    [0.72,0.04],[0.80,0.08],[0.85,0.12],[0.88,0.18],[0.86,0.25],
    [0.82,0.32],[0.75,0.38],[0.68,0.42],[0.58,0.44],
    [0.48,0.42],[0.38,0.38],[0.28,0.36],[0.20,0.32],
    [0.12,0.28],[0.08,0.22],[0.10,0.15]
  ];
  mapCtx.moveTo(cx+body[0][0]*scale,cy+body[0][1]*scale);
  for(let i=1;i<body.length;i++){
    mapCtx.lineTo(cx+body[i][0]*scale,cy+body[i][1]*scale);
  }
  mapCtx.closePath();
  mapCtx.stroke();
  mapCtx.fillStyle=mapCtx.strokeStyle;
  mapCtx.globalAlpha=0.08;
  mapCtx.fill();
  mapCtx.globalAlpha=1;

  // Province lines (decorative)
  mapCtx.globalAlpha=0.12;
  mapCtx.beginPath();
  const provinces=[
    [[0.18,0.08],[0.32,0.04],[0.46,0.08],[0.58,0.06]],
    [[0.22,0.20],[0.36,0.16],[0.50,0.20],[0.64,0.18]],
    [[0.28,0.32],[0.42,0.28],[0.56,0.32],[0.68,0.30]],
    [[0.18,0.40],[0.30,0.38],[0.42,0.36],[0.54,0.40]]
  ];
  provinces.forEach(pts=>{
    mapCtx.moveTo(cx+pts[0][0]*scale,cy+pts[0][1]*scale);
    for(let i=1;i<pts.length;i++) mapCtx.lineTo(cx+pts[i][0]*scale,cy+pts[i][1]*scale);
  });
  mapCtx.stroke();
  mapCtx.globalAlpha=1;

  // Surrounding geography hints (corners)
  mapCtx.globalAlpha=0.08;
  mapCtx.font=`${scale*0.025}px sans-serif`;
  mapCtx.textAlign='center';
  mapCtx.fillText('中亚 · Central Asia',cx-scale*0.9,cy-scale*0.15);
  mapCtx.fillText('俄罗斯 · Russia',cx+scale*0.15,cy-scale*0.25);
  mapCtx.fillText('蒙古 · Mongolia',cx+scale*0.4,cy-scale*0.2);
  mapCtx.fillText('朝鲜半岛',cx+scale*0.85,cy+scale*0.1);
  mapCtx.fillText('日本 · Japan',cx+scale*0.9,cy+scale*0.25);
  mapCtx.fillText('东南亚',cx+scale*0.5,cy+scale*0.52);
  mapCtx.fillText('南亚 · South Asia',cx-scale*0.3,cy+scale*0.45);
  mapCtx.fillText('喜马拉雅',cx-scale*0.4,cy+scale*0.2);
  mapCtx.textAlign='start';
  mapCtx.globalAlpha=1;

  // City markers
  const markerColor=getComputedStyle(document.documentElement).getPropertyValue('--map-marker-fill').trim();
  const cities=[
    {name:'西安',x:0.12,y:0.08},{name:'北京',x:0.38,y:-0.08},
    {name:'深圳',x:0.35,y:0.35},{name:'上海',x:0.52,y:0.20},
    {name:'成都',x:0.02,y:0.18},{name:'兰州',x:-0.02,y:-0.02},
    {name:'杭州',x:0.48,y:0.24}
  ];
  cities.forEach(c=>{
    const mx=cx+c.x*scale,my=cy+c.y*scale;
    mapCtx.fillStyle=markerColor;
    mapCtx.beginPath();mapCtx.arc(mx,my,3.5,0,Math.PI*2);mapCtx.fill();
    mapCtx.fillStyle=getComputedStyle(document.documentElement).getPropertyValue('--color-text').trim();
    mapCtx.globalAlpha=0.55;
    mapCtx.font=`${scale*0.022}px sans-serif`;
    mapCtx.fillText(c.name,mx+6,my+4);
    mapCtx.globalAlpha=1;
  });

  // China label centered
  mapCtx.globalAlpha=0.2;
  mapCtx.font=`${scale*0.06}px serif`;
  mapCtx.textAlign='center';
  mapCtx.fillText('中 国',cx,cy-scale*0.02);
  mapCtx.textAlign='start';
  mapCtx.globalAlpha=1;
}

// ============================================================
// PANEL RENDERING
// ============================================================
function renderConsolePanel(stage){
  const projects=PROJECTS.filter(p=>p.stage===stage);
  const list=document.getElementById('console-list');
  list.innerHTML=projects.map(p=>`
    <div class="console-item${selectedProjectId===p.id?' active':''}" data-id="${p.id}">
      <div style="font-weight:600;margin-bottom:2px">${p.title}</div>
      <div style="font-size:11px;color:var(--color-muted)">📍 ${p.location}</div>
    </div>
  `).join('');

  list.querySelectorAll('.console-item').forEach(el=>{
    el.addEventListener('click',()=>selectProject(el.dataset.id));
  });

  if(!selectedProjectId||!projects.find(p=>p.id===selectedProjectId)){
    const first=projects[0];
    if(first) selectProject(first.id);
    else showEmptyDisplay();
  }
}

function selectProject(id){
  selectedProjectId=id;
  const p=PROJECTS.find(x=>x.id===id);
  if(!p)return;
  document.getElementById('display-empty').style.display='none';
  document.getElementById('display-empty-text').style.display='none';
  const dc=document.getElementById('display-content');dc.style.display='block';
  document.getElementById('display-img').src=p.image;
  document.getElementById('display-title').textContent=p.title;
  document.getElementById('display-desc').textContent=p.desc;
  document.getElementById('display-tags').innerHTML=p.tags.map(t=>`<span class="display-tag">${t}</span>`).join('');
  document.getElementById('display-location').textContent='📍 '+p.location;
  // Update console active state
  document.querySelectorAll('.console-item').forEach(el=>el.classList.toggle('active',el.dataset.id===id));
}

function showEmptyDisplay(){
  selectedProjectId=null;
  document.getElementById('display-empty').style.display='block';
  document.getElementById('display-empty-text').style.display='block';
  document.getElementById('display-content').style.display='none';
}

// ============================================================
// MOBILE FLOW
// ============================================================
function renderMobileFlow(stage){
  const projects=PROJECTS.filter(p=>p.stage===stage);
  const container=document.getElementById('project-flow-mobile');
  container.innerHTML=projects.map(p=>`
    <div class="project-card-mobile" data-id="${p.id}">
      <img class="card-image-mobile" src="${p.mobileImage}" alt="${p.title}" loading="lazy" onerror="this.style.background='var(--color-tag-bg)';this.style.minHeight='170px'">
      <div class="card-content-mobile">
        <div class="card-title-mobile">${p.title}</div>
        <div class="card-desc-mobile">${p.desc}</div>
        <div class="card-tags-mobile">${p.tags.map(t=>`<span class="card-tag-mobile">${t}</span>`).join('')}</div>
        <div class="card-location-mobile">📍 ${p.location}</div>
      </div>
    </div>
  `).join('');
  container.querySelectorAll('.project-card-mobile').forEach(el=>{
    el.addEventListener('click',()=>{
      const p=PROJECTS.find(x=>x.id===el.dataset.id);
      if(p) openModal(p);
    });
  });
}

// ============================================================
// THEME SWITCHING
// ============================================================
let themeTransitioning=false;

function setTheme(theme){
  if(currentStage===theme)return;
  currentStage=theme;
  const s=STAGES[theme];
  document.documentElement.setAttribute('data-theme',theme);

  document.getElementById('stage-badge').textContent=s.badge;
  document.getElementById('stage-desc').textContent=s.description;
  document.querySelectorAll('.theme-dot').forEach(d=>d.classList.toggle('active',d.dataset.theme===theme));

  drawMap();
  drawTicks();
  renderConsolePanel(theme);
  renderMobileFlow(theme);
}

function detectStageForYear(year){
  if(year<STAGES.code.yearStart)return'garden';
  if(year<STAGES.ai.yearStart)return'code';
  return'ai';
}

// ============================================================
// CALIPER TICKS DRAWING
// ============================================================
const ticksCanvas=document.getElementById('ticks-canvas');
const ticksCtx=ticksCanvas.getContext('2d');

function drawTicks(){
  const wrap=document.getElementById('caliper-ticks');
  const w=wrap.clientWidth,h=wrap.clientHeight;
  ticksCanvas.width=w;ticksCanvas.height=h;
  ticksCtx.clearRect(0,0,w,h);

  const totalYears=YEAR_END-YEAR_START;
  const tickColor=getComputedStyle(document.documentElement).getPropertyValue('--caliper-tick').trim();
  const labelColor=getComputedStyle(document.documentElement).getPropertyValue('--caliper-label').trim();

  for(let y=2017;y<=2026;y++){
    const ratio=(y-YEAR_START)/totalYears;
    const x=ratio*w;
    // Major tick (year)
    ticksCtx.strokeStyle=tickColor;
    ticksCtx.lineWidth=1;
    ticksCtx.beginPath();
    ticksCtx.moveTo(x,h-12);ticksCtx.lineTo(x,h);
    ticksCtx.stroke();
    // Label
    ticksCtx.fillStyle=labelColor;
    ticksCtx.font='10px sans-serif';
    ticksCtx.textAlign='center';
    ticksCtx.fillText(y,x,h-14);
    ticksCtx.textAlign='start';

    // Minor ticks (months)
    for(let m=1;m<=11;m++){
      const my=y+m/12;
      if(my>YEAR_END)break;
      const mr=(my-YEAR_START)/totalYears;
      const mx=mr*w;
      ticksCtx.beginPath();
      ticksCtx.moveTo(mx,h-6);ticksCtx.lineTo(mx,h);
      ticksCtx.stroke();
    }
  }

  // Stage boundary markers on ticks
  const boundaryColor=getComputedStyle(document.documentElement).getPropertyValue('--stage-boundary').trim();
  [STAGES.code.yearStart,STAGES.ai.yearStart].forEach(by=>{
    const br=(by-YEAR_START)/totalYears;
    const bx=br*w;
    ticksCtx.strokeStyle=boundaryColor;
    ticksCtx.lineWidth=1;
    ticksCtx.setLineDash([4,4]);
    ticksCtx.beginPath();
    ticksCtx.moveTo(bx,0);ticksCtx.lineTo(bx,h);
    ticksCtx.stroke();
    ticksCtx.setLineDash([]);

    const stageLabel=by===STAGES.code.yearStart?'code→':'AI→';
    ticksCtx.fillStyle=boundaryColor;
    ticksCtx.font='9px sans-serif';
    ticksCtx.textAlign='center';
    ticksCtx.fillText(stageLabel,bx,h-20);
    ticksCtx.textAlign='start';
  });

  updateBoundaries();
}

function updateBoundaries(){
  const totalYears=YEAR_END-YEAR_START;
  const wrap=document.getElementById('caliper-track-wrap');
  const w=wrap.clientWidth;
  document.getElementById('boundary-1').style.left=((STAGES.code.yearStart-YEAR_START)/totalYears*100)+'%';
  document.getElementById('boundary-2').style.left=((STAGES.ai.yearStart-YEAR_START)/totalYears*100)+'%';
}

// ============================================================
// CALIPER SLIDER DRAG
// ============================================================
const slider=document.getElementById('caliper-slider');
const trackWrap=document.getElementById('caliper-track-wrap');
const yearDisplay=document.getElementById('year-display');

function yearFromRatio(ratio){
  return YEAR_START+ratio*(YEAR_END-YEAR_START);
}
function ratioFromYear(year){
  return (year-YEAR_START)/(YEAR_END-YEAR_START);
}
function formatYear(year){
  const y=Math.floor(year);
  const m=Math.round((year-y)*12)+1;
  return y+'.'+m;
}

function moveSlider(clientX){
  const rect=trackWrap.getBoundingClientRect();
  let ratio=(clientX-rect.left)/rect.width;
  ratio=Math.max(0,Math.min(1,ratio));
  slider.style.left=(ratio*100)+'%';
  const year=yearFromRatio(ratio);
  yearDisplay.textContent=formatYear(year);
  return year;
}

slider.addEventListener('pointerdown',e=>{
  e.preventDefault();isDragging=true;
  slider.classList.add('dragging');
  slider.setPointerCapture(e.pointerId);
});
slider.addEventListener('pointermove',e=>{
  if(!isDragging)return;
  const year=moveSlider(e.clientX);
  const stage=detectStageForYear(year);
  if(stage!==currentStage) setTheme(stage);
});
slider.addEventListener('pointerup',()=>{
  if(!isDragging)return;isDragging=false;
  slider.classList.remove('dragging');
});
slider.addEventListener('pointerleave',()=>{
  if(isDragging){isDragging=false;slider.classList.remove('dragging');}
});

trackWrap.addEventListener('pointerdown',e=>{
  if(e.target===slider||slider.contains(e.target))return;
  const year=moveSlider(e.clientX);
  const stage=detectStageForYear(year);
  if(stage!==currentStage) setTheme(stage);
});

// ============================================================
// MODAL
// ============================================================
function openModal(p){
  document.getElementById('modal-img').src=p.image;
  document.getElementById('modal-title').textContent=p.title;
  document.getElementById('modal-desc').textContent=p.desc;
  document.getElementById('modal-tags').innerHTML=p.tags.map(t=>`<span class="display-tag">${t}</span>`).join('');
  document.getElementById('modal-location').textContent='📍 '+p.location;
  document.getElementById('modal-overlay').classList.add('active');
  document.body.style.overflow='hidden';
}
function closeModal(){
  document.getElementById('modal-overlay').classList.remove('active');
  document.body.style.overflow='';
}
document.getElementById('modal-overlay').addEventListener('click',e=>{if(e.target===e.currentTarget)closeModal()});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});

// ============================================================
// INIT
// ============================================================
function init(){
  resizeMap();
  window.addEventListener('resize',()=>{resizeMap();drawTicks();updateBoundaries()});
  drawTicks();
  renderConsolePanel('garden');
  renderMobileFlow('garden');

  // Initial slider position
  slider.style.left=(ratioFromYear(YEAR_START)*100)+'%';
  yearDisplay.textContent=formatYear(YEAR_START);
}
init();
</script>
